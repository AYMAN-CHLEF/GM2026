{% if lesson.interactive_map %}
<div class="my-6 p-4 bg-white rounded-2xl shadow-sm border border-gray-100">
    <div class="flex justify-between items-center mb-3">
        <h3 class="font-bold text-gray-800 text-sm flex items-center gap-2">
            <span>🗺️</span> {{ lesson.interactive_map.title }}
        </h3>
        <div class="flex gap-2">
            {% if lesson.interactive_map.allow_student_drawing %}
            <span class="text-xs bg-amber-50 text-amber-700 px-3 py-1 rounded-full font-medium">أدوات الرسم والتلوين مفعلة ✍️</span>
            {% endif %}
            <span class="text-xs bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full font-medium">خريطة جيوماتكس متقدمة</span>
        </div>
    </div>

    <!-- حاوية الخريطة -->
    <div class="relative w-full h-[500px] rounded-xl shadow-inner border border-gray-200 overflow-hidden z-10">
        <div id="advanced-interactive-map" 
             data-lat="{{ lesson.interactive_map.latitude }}" 
             data-lng="{{ lesson.interactive_map.longitude }}" 
             data-zoom="{{ lesson.interactive_map.zoom_level }}"
             data-title="{{ lesson.interactive_map.title }}"
             data-draw-allowed="{{ lesson.interactive_map.allow_student_drawing|lower }}"
             data-game-allowed="{{ lesson.interactive_map.allow_student_markers|lower }}"
             class="w-full h-full">
        </div>
    </div>
</div>

<!-- استدعاء مكتبات Leaflet الأساسية -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<!-- استدعاء مكتبات الرسم والتلوين (Leaflet.Draw CSS & JS) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    var mapElement = document.getElementById('advanced-interactive-map');
    if (!mapElement) return;

    var targetLat = parseFloat(mapElement.getAttribute('data-lat'));
    var targetLng = parseFloat(mapElement.getAttribute('data-lng'));
    var zoomLevel = parseInt(mapElement.getAttribute('data-zoom'));
    var mapTitle = mapElement.getAttribute('data-title');
    var allowDrawing = mapElement.getAttribute('data-draw-allowed') === 'true';
    var allowGame = mapElement.getAttribute('data-game-allowed') === 'true';

    // 1. طبقات الخريطة الأساسية (شوارع + أقمار صناعية)
    var streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' });
    var satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: '&copy; Esri' });

    var map = L.map('advanced-interactive-map', {
        center: [targetLat, targetLng],
        zoom: zoomLevel,
        layers: [streetLayer]
    });

    L.control.layers({ "خريطة الشوارع": streetLayer, "الأقمار الصناعية (GIS)": satelliteLayer }).addTo(map);

    // 2. العلامة الرئيسية للدرس مع إمكانية إضافة معلومات وصفية
    var mainMarker = L.marker([targetLat, targetLng]).addTo(map);
    mainMarker.bindPopup(`
        <div dir="rtl" style="font-family: Cairo, sans-serif; text-align: right;">
            <b style="color: #047857; font-size: 13px;">📍 محطة الدرس الأساسية:</b><br>
            <p style="margin: 4px 0 0 0; font-size: 11px;">${mapTitle}</p>
        </div>
    `).openPopup();

    // 3. تفعيل أدوات الرسم والتلوين (إذا كانت مفعلة من لوحة التحكم)
    if (allowDrawing) {
        // طبقة لحفظ الأشكال والرسومات التي يرسمها المستخدم
        var drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        var drawControl = new L.Control.Draw({
            edit: {
                featureGroup: drawnItems,
                remove: true
            },
            draw: {
                polygon: { title: 'ارسم مضلعاً لتحديد إقليم أو منطقة جغرافية', allowIntersection: false, shapeOptions: { color: '#047857' } },
                polyline: { title: 'ارسم خطاً لتحديد طريق أو وادٍ أو حدود', shapeOptions: { color: '#2563eb' } },
                rectangle: { title: 'ارسم مستطيلاً', shapeOptions: { color: '#d97706' } },
                circle: { title: 'ارسم دائرة تأثير', shapeOptions: { color: '#dc2626' } },
                marker: { title: 'أضف علامة موقع جديدة' },
                circlemarker: false
            }
        });
        map.addControl(drawControl);

        // التقاط الأشكال المرسومة وتخزينها أو التفاعل معها مؤقتاً
        map.on(L.Draw.Event.CREATED, function (e) {
            var layer = e.layer;
            
            // إضافة نافذة منبثقة للمعلومات للشكل المرسوم
            layer.bindPopup(`
                <div dir="rtl" style="font-family: Cairo, sans-serif;">
                    <b>✏️ عنصر تم رسمه بواسطة الطالب</b><br>
                    <input type="text" placeholder="اكتب اسم أو وصف الموقع..." class="border p-1 text-xs rounded mt-1 w-full" id="custom-shape-desc">
                </div>
            `);
            
            drawnItems.addLayer(layer);
        });
    }

    // 4. تفعيل وضع التفاعل والتخمين (إذا كان مسموحاً)
    if (allowGame && !allowDrawing) {
        var userGuessMarker = null;
        map.on('click', function(e) {
            var clickedLat = e.latlng.lat;
            var clickedLng = e.latlng.lng;
            var distanceKm = map.distance([targetLat, targetLng], [clickedLat, clickedLng]) / 1000;

            if (userGuessMarker) { map.removeLayer(userGuessMarker); }

            userGuessMarker = L.marker([clickedLat, clickedLng], {
                icon: L.icon({
                    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
                    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
                    iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
                })
            }).addTo(map);

            var msg = distanceKm < 25 ? `🎉 ممتاز! إجابة دقيقة (تبعد ${distanceKm.toFixed(1)} كم).` : `❌ حاول مجدداً! الموقع يبعد بـ ${distanceKm.toFixed(1)} كم.`;
            userGuessMarker.bindPopup(`<div dir="rtl"><b>🎯 اختيارك:</b><br>${msg}</div>`).openPopup();
        });
    }
});
</script>
{% endif %}
