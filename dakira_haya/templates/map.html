{% load static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'ar' }}" dir="{% if LANGUAGE_CODE == 'ar' %}rtl{% else %}ltr{% endif %}">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة المسارات الرقمية | Geo-Memory</title>

    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'css/site-wide.css' %}">
</head>
<body>
{% include 'site_header.html' %}

    <nav class="top-nav">
        <div class="nav-controls">
            <button id="toggle-btn" class="btn-control"><i class="fas fa-play"></i></button>
            <button id="audio-btn" class="btn-control"><i class="fas fa-volume-up"></i></button>
        </div>
        <div class="nav-title">
            <i class="fas fa-map-location-dot"></i>
            <span>Geo-Memory Map</span>
        </div>
    </nav>

    <div id="overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:2000; align-items:center; justify-content:center;"></div>
    <div id="map"></div>

    <div id="loading-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); color:white; display:flex; align-items:center; justify-content:center; z-index:3000;">
        <i class="fas fa-spinner fa-spin fa-3x"></i>
    </div>

    <script>
        window.AUDIO_PATH = "{% static 'audio/background-music.mp3' %}";
    </script>

    <script src="{% static 'js/map_engine.js' %}"></script>
    <script src="{% static 'data/bin-badis.js' %}"></script>
    <script src="{% static 'js/ma.js' %}"></script>

    <script>
        // تمرير البيانات من Django
        window.scienceData = {{ science_data_json|safe }};

        // التأكد من جاهزية الخريطة
        window.addEventListener('load', () => {
            if (typeof map !== 'undefined') {
                map.on('load', () => {
                    console.log("الخريطة جاهزة والبيانات تم استلامها.");
                    document.getElementById('loading-overlay').style.display = 'none';
                });
            }
        });
    </script>
<script src="{% static 'js/site-wide-i18n.js' %}" defer></script>
{% include 'site_footer.html' %}
</body>
</html>
